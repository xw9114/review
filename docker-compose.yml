services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_review}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_review} -d ${POSTGRES_DB:-knowledge_review}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://knowledge_review:change-me@postgres:5432/knowledge_review}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NOTEBOOK_API_URL: ${NOTEBOOK_API_URL:-}
      NOTEBOOK_API_TOKEN: ${NOTEBOOK_API_TOKEN:-}
      NOTEBOOK_TIMEOUT_SECONDS: ${NOTEBOOK_TIMEOUT_SECONDS:-10}
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:-}
      CRAWL4AI_API_URL: ${CRAWL4AI_API_URL:-}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      CRAWL4AI_TIMEOUT_SECONDS: ${CRAWL4AI_TIMEOUT_SECONDS:-45}
      FEED_FETCH_TIMEOUT_SECONDS: ${FEED_FETCH_TIMEOUT_SECONDS:-15}
      FEED_MAX_BYTES: ${FEED_MAX_BYTES:-5242880}
      FEED_MAX_ITEMS: ${FEED_MAX_ITEMS:-30}
      FEED_MAX_CRAWL_ITEMS: ${FEED_MAX_CRAWL_ITEMS:-5}
      FEED_AUTO_CRAWL_THRESHOLD: ${FEED_AUTO_CRAWL_THRESHOLD:-280}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-0.60}
      RELEVANCE_BATCH_SIZE: ${RELEVANCE_BATCH_SIZE:-20}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_MAX_SOURCE_CHARS: ${LLM_MAX_SOURCE_CHARS:-12000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2500}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  rsshub:
    image: ghcr.io/diygod/rsshub:2026-09-18
    profiles: ["ingestion"]
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
    expose:
      - "1200"
    mem_limit: 384m
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    profiles: ["ingestion"]
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      MAX_CONCURRENT_TASKS: "1"
    expose:
      - "11235"
    shm_size: 512m
    mem_limit: 896m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11235/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
